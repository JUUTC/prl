[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/JUUTC/prl"

[workspace.dependencies]
# Library crates use Bevy without default features; only the `prl` binary
# (and crates that truly need rendering/audio) enable more.
bevy = { version = "0.20", default-features = false }
blake3 = "1.8"
rand_chacha = { version = "0.10", default-features = false }
rand_core = { version = "0.10", default-features = false }
ron = "0.10"
serde = { version = "1", features = ["derive"] }

prl_audio = { path = "crates/prl_audio" }
prl_content = { path = "crates/prl_content" }
prl_core = { path = "crates/prl_core" }
prl_gen = { path = "crates/prl_gen" }
prl_render = { path = "crates/prl_render" }
prl_save = { path = "crates/prl_save" }
prl_ui = { path = "crates/prl_ui" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
# Bevy idioms: systems take `Res`/`Query` by value, have many params and complex query types.
needless_pass_by_value = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
module_name_repetitions = "allow"

# Fast iteration in dev while keeping dependencies optimized.
[profile.dev]
opt-level = 1
debug = 0

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
